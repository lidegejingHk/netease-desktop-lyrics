  * { box-sizing: border-box; }

  /* ================================================================
     浮层本体 · 两种设计方向共享几何，只换设计语言
     几何对齐 Swift 源码：876 宽 / 顶行 40 / 大内边距 16 / 轨高 28
     ================================================================ */
  .player {
    --pad: 18px;
    position: relative; width: 876px; border-radius: 30px;
    padding: 2px var(--pad) 22px;
    display: flex; flex-direction: column;

  }

  /* ==================== 顶行 ==================== */
  .chrome { height: 52px; display: flex; align-items: center; position: relative; }
  .title { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }

  .tool:active { transform: scale(.92); }

  /* ==================== 歌词区 ==================== */
  .lyrics {

  .row { position: relative; display: flex; justify-content: center; text-align: center; width: 100%; }
  .row .base, .row .litLayer, .row .lit, .row .tlit { white-space: pre; }
  .row.current { min-height: 46px; align-items: center; padding: 5px 0; --enter: 22px; }

  .row.current.dull .base { font-size: 15px !important; font-family: "Space Mono", ui-monospace, monospace !important;
    font-weight: 400 !important; letter-spacing: .42em !important; text-indent: .42em; }

  .row.current > .base, .row.current > .litLayer { animation: enterUp .68s cubic-bezier(.16, 1, .3, 1) both; }
  .row.next > .base { animation: enterUp .68s cubic-bezier(.16, 1, .3, 1) both; }

  .litLayer .lit .ch { display: inline-block; white-space: pre; }
  .karaoke { position: relative; display: inline-block; }
  .kmark {
    position: absolute; top: 50%; width: 3px; height: 62%; border-radius: 3px;

  @keyframes kPulse { 0%,100% { opacity: .95; } 50% { opacity: .45; } }


  .row.next .tlit { font-size: 16.5px; font-weight: 400; letter-spacing: .06em;
    font-family: "Noto Sans SC", "PingFang SC", sans-serif; }
  .row.next .tlit .ch { animation-delay: calc(var(--i, 0) * 14ms); }

  /* 入行过渡：降低 12px、聚焦上浮 + 一次柔光 */
  @keyframes enterUp {
    from { opacity: 0; transform: translateY(var(--enter, 20px)); }
    to { opacity: 1; transform: translateY(0); }
  }
  .kshard { position: absolute; left: 0; right: 0; top: 50%; height: 40px; margin-top: -20px;
    border-radius: 30px; opacity: 0; pointer-events: none;
    animation: kshine .9s ease-out .06s both; }
  @keyframes kshine { 0% { opacity: 0; } 22% { opacity: 1; } 100% { opacity: 0; } }

  /* ==================== 波形轨 ==================== */
  .railWrap { margin-top: 10px; position: relative; height: 30px; }
  .rail {
    position: absolute; inset: 0; flex: none;

    -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 46px, #000 calc(100% - 44px), transparent 100%);
    mask-image: linear-gradient(90deg, transparent 0, #000 46px, #000 calc(100% - 44px), transparent 100%);
  }
  .rail .wave { position: absolute; inset: 0; }
  .waveInner { position: absolute; inset: 0; display: flex; align-items: center; gap: 2px; }
  .waveInner.litwrap { will-change: clip-path; }
  .wavebar {
    flex: 1 1 0; min-width: 1px; border-radius: 1.5px; transform-origin: 50% 50%;
    background: var(--dim); will-change: transform;
    animation: barPulse calc(1.15s + var(--sp) * .55s) ease-in-out infinite;

  @keyframes barPulse {

  }
  .railprog {
    position: absolute; left: 0; bottom: -6px; height: 1.5px; border-radius: 2px;
    background: var(--accent); opacity: .8; transition: opacity .3s;
  }
  .bottomrow {
    position: absolute; left: 8px; right: 8px; bottom: -7px;
    display: flex; justify-content: space-between; pointer-events: none;
  }
  .tm { font-family: "Space Mono", ui-monospace, monospace; font-size: 10px; letter-spacing: .14em; color: var(--ink-3); }
  .lp-b .tm { color: rgba(35,38,44,.38); }


  /* ==================== 无障碍 / 降级 ==================== */
  @media (prefers-reduced-motion: reduce) {
    .eq i, .wavebar, .karaoke::after, .kshard, .row.current > .base,
    .row.current > .litLayer, .row.next > .base, .tlit .ch { animation: none !important; }
    .tlit .ch { opacity: 1; filter: none; transform: none; }
    .kshard { opacity: 0; }
  }

</style>

<script type="text/babel" data-presets="react">
const { useState, useRef, useEffect, useMemo, useCallback } = React;

/* ============================== 演示数据 ==============================
   歌词为示意文案（非真实歌词），可直接替换成你自己的 LRC 时间轴      */
function demoLyrics(lines) {
  return lines.map(([start, end, text]) => ({ s: start, e: end, text }));
}
const TRACKS = [
  {
    title: "七月的海", artist: "林晚", duration: 96000,
    lyrics: demoLyrics([
      [7000, 12000, "如果赶得上末班车"],

      [16000, 21500, "I keep your number in the dark"],
      [21500, 27000, "A flicker waiting for a spark"],
      [27000, 32500, "Cities hum and satellites"],
      [32500, 38000, "Trace the shape of sleepless nights"],

      [43500, 49000, "Leave a message, I'll be fine"],
      [49000, 54500, "Distance is a kind of sound"],
      [54500, 60000, "Low and steady, all year round"],

    ]),

/* ============================== 工具函数 ============================== */
const pad2 = (n) => String(Math.floor(n)).padStart(2, "0");
const fmtTime = (ms) => {
  if (!isFinite(ms) || ms < 0) ms = 0;
  const s = Math.floor(ms / 1000);
  return pad2(s / 60) + ":" + pad2(s % 60);
};
const WAVE_N = 112;
function makeBars(seed) {
  const bars = [];
  for (let i = 0; i < WAVE_N; i++) {
    const t = i / WAVE_N;
    let h =
      Math.abs(Math.sin(t * 19 + seed)) * 0.42 +
      Math.abs(Math.sin(t * 7.3 + seed * 1.7)) * 0.34 +
      Math.abs(Math.sin(t * 41 + seed * 2.9)) * 0.16;
    const envelope = 0.58 + 0.42 * Math.abs(Math.sin(t * Math.PI * 2.2 + seed));
    bars.push(Math.min(1, Math.max(0.1, h * envelope)));
  }
  return bars;
}
const BARS = [makeBars(1.35), makeBars(4.1)];
const MOTION_OK = typeof window !== "undefined" && window.matchMedia
  ? !window.matchMedia("(prefers-reduced-motion: reduce)").matches : true;

/* ============================== 图标 ============================== */
const I = {

      <path d="M18 6.4v11.2" />
    </svg>
  ),
  play: (
    <svg viewBox="0 0 24 24" width="27" height="27">
      <path d="M8.4 5.9v12.2L18.6 12z" fill="currentColor" />
    </svg>
  ),
  pause: (
    <svg viewBox="0 0 24 24" width="27" height="27">
      <rect x="7.4" y="6" width="3.3" height="12" rx="1.5" fill="currentColor" />
      <rect x="13.3" y="6" width="3.3" height="12" rx="1.5" fill="currentColor" />
    </svg>
  ),
  lock: (
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round">
      <rect x="5.5" y="10.6" width="13" height="8.9" rx="2.4" />
      <path d="M8.6 10.6V8.1a3.4 3.4 0 0 1 6.8 0v2.5" />
    </svg>
  ),
  palette: (
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round">
      <path d="M12 4.2c-4.3 0-7.8 3.4-7.8 7.7 0 4.3 3.4 7.7 7.7 7.7 1.7 0 3.1-1 3.1-2.6 0-.9-.4-1.5-.4-2.3 0-1.2 1-1.9 2.2-1.9h1.1c1.9 0 3.3-1.4 3.3-3.3 0-3-3.4-5.3-7.9-5.3z" />
      <circle cx="8.4" cy="10.1" r="1.05" fill="currentColor" stroke="none" />
      <circle cx="12" cy="8.2" r="1.05" fill="currentColor" stroke="none" />
      <circle cx="15.7" cy="10.1" r="1.05" fill="currentColor" stroke="none" />
    </svg>
  ),
  chevron: (
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
      <path d="M9.4 6.6l5.6 5.4-5.6 5.4" />
    </svg>
  ),
};

function Tool({ title, tip, active, onClick, children }) {
  return (
    <button
      type="button"
      className={"tool" + (active ? " active" : "")}
      title={tip}
      aria-label={tip}
      aria-pressed={!!active}
      onClick={onClick}
    >
      {children}
    </button>
  );
}

/* ============================== 主浮层 ============================== */
function Player({ variant, tracks, songIndex, setSongIndex, initialPos = 0 }) {
  const [playing, setPlaying] = useState(true);
  const [locked, setLocked] = useState(false);
  const [theme, setTheme] = useState(0);
    const [pos, setPos] = useState(initialPos);

  const posRef = useRef(initialPos);
  const playingRef = useRef(true);
  const prevTrackRef = useRef(songIndex);
  const railRef = useRef(null);
  const songIndexRef = useRef(songIndex);
  useEffect(() => { playingRef.current = playing; }, [playing]);
  useEffect(() => { songIndexRef.current = songIndex; }, [songIndex]);

  // 切歌：回到开头
  useEffect(() => {
    if (prevTrackRef.current !== songIndex) {
      prevTrackRef.current = songIndex;
      posRef.current = 0;
      setPos(0);
      setPlaying(true);
    }
  }, [songIndex]);

  // 播放时钟（rAF 驱动）
  useEffect(() => {
    let raf = 0, last = performance.now();
    const tick = (now) => {
      const dt = Math.min(64, now - last); last = now;
      if (playingRef.current) {
        posRef.current += dt;
        const dur = tracks[songIndexRef.current].duration;
        if (posRef.current >= dur + 900) {
          setSongIndex((songIndexRef.current + 1) % tracks.length);
        } else {
          setPos(posRef.current);
        }
      }
      raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, [tracks, setSongIndex]);

  const song = tracks[songIndex];
  const dur = song.duration;
  const progress = Math.min(1, Math.max(0, pos / dur));

  // 当前歌词行与行内进度
  let lineIdx = -1, lineFrac = 0;
  for (let i = 0; i < song.lyrics.length; i++) {
    const L = song.lyrics[i];
    if (pos >= L.s && pos <= L.e) { lineIdx = i; lineFrac = (pos - L.s) / Math.max(1, L.e - L.s); break; }
    if (pos < L.s) { lineIdx = i - 1; break; }
  }
  if (lineIdx === -1 && pos >= song.lyrics[song.lyrics.length - 1].e) lineIdx = song.lyrics.length - 1;
  const outtro = lineIdx === -1;
  const line = song.lyrics[Math.max(0, lineIdx)];
  const next = song.lyrics[lineIdx + 1];
  const pct = Math.round(lineFrac * 100);
  const isNewLine = lineFrac < 0.012;

  const toggle = useCallback(() => setPlaying(p => !p), []);
  const nextTrack = () => setSongIndex((songIndex + 1) % tracks.length);
  const prevTrack = () => {
    if (posRef.current > 2200 || songIndex === 0) { posRef.current = 0; setPos(0); }
    else setSongIndex((songIndex - 1 + tracks.length) % tracks.length);
  };
  const seek = (clientX) => {
    const el = railRef.current;
    if (!el) return;
    const r = el.getBoundingClientRect();
    const f = Math.min(1, Math.max(0, (clientX - r.left) / r.width));
    posRef.current = f * dur; setPos(posRef.current);
  };

  const bars = BARS[theme % BARS.length];
  const playingCls = playing ? " is-playing" : "";

  const karaokeSpans = (line, p) => (
    <>
      <span className="base">{line.text}</span>
      <span className="litLayer">
        <span className="karaoke" style={{ "--p": p }}>
          <span className="lit">{line.text}</span>
          {(p > 3 && p < 98 && playing) ? <span className="kmark" style={{ left: p + "%" }} /> : null}
        </span>
      </span>
    </>
  );

  return (
    <div
      className={"player lp-" + variant + " theme-" + theme + playingCls + ""}
    >
      <span className="lyric-glow" aria-hidden="true" />

      {/* 顶行：歌名 · 播放键 · 工具 */}
      <div className="chrome">
        <div className="title">
          <span className="eq" aria-hidden="true"><i /><i /><i /></span>
          <span className="tn">{song.title}</span>
          <span className="ta">— {song.artist}</span>
        </div>
        <div className="transport">
          <button type="button" className="tbtn" title="上一首" aria-label="上一首" onClick={prevTrack}>{I.prev}</button>
          <button type="button" className="tbtn pp" title={playing ? "暂停" : "播放"} aria-label={playing ? "暂停" : "播放"} onClick={toggle}>
            {playing ? I.pause : I.play}
          </button>
          <button type="button" className="tbtn" title="下一首" aria-label="下一首" onClick={nextTrack}>{I.next}</button>
        </div>
        <div className="tools">
          <Tool tip={locked ? "已锁定 · 点击解锁" : "锁定位置"} active={locked} onClick={() => setLocked(v => !v)}>{I.lock}</Tool>
          <Tool tip="样式面板（演示：切换主题）" onClick={() => setTheme(v => v + 1)}>{I.palette}</Tool>
          <Tool tip="吸附到屏幕右缘（演示）" onClick={() => {}}>{I.chevron}</Tool>
        </div>
      </div>

      {/* 歌词区：当前句 + 下一句 */}
      <div className="lyrics" key={songIndex}>
        <div className={"row current" + (outtro ? " dull" : "")} key={"c" + lineIdx}>
          {!outtro && karaokeSpans(line, pct)}
          {outtro && <span className="base">{songIndex === 0 ? "· · ·" : "· · ·"}</span>}
        </div>
        <div className="row next" key={"n" + (lineIdx + 1)}>
          <span className="base">{next ? next.text : ""}</span>
        </div>
      </div>

      {/* 波形：整首进度 + 跳动 */}
      <div className="railWrap">
      <div
        className="rail"
        ref={railRef}
        onPointerDown={(e) => { seek(e.clientX); }}
        title="点击跳转"
      >
        <span className="ticks" aria-hidden="true" />
        <div className="wave">
          <div className="waveInner">
            {bars.map((b, i) => (
              <i
                key={i}
                className={"wavebar q" + (i % 4)}
                style={{ "--h": b, "--ph": i * 0.45, "--sp": 0.55 + (i % 7) * 0.09, height: (b * 95) + "%" }}
              />
            ))}
          </div>
          <div className="waveInner litwrap" style={{ clipPath: "inset(0 " + ((1 - progress) * 100) + "% 0 0)" }}>
            {bars.map((b, i) => (
              <i
                key={i}
                className={"wavebar q" + (i % 4)}
                style={{ "--h": b, "--ph": i * 0.45, "--sp": 0.55 + (i % 7) * 0.09, height: (b * 95) + "%" }}
              />
            ))}
          </div>
        </div>
        <span className="railprog" style={{ width: (progress * 100) + "%" }} />
      </div>
      <div className="bottomrow">
        <span className="tm live">{fmtTime(pos)}</span>
        <span className="tm total">{fmtTime(dur)}</span>
      </div>
      </div>
    </div>
  );
}

/* ============================== 缩放舞台 ============================== */
function Stage({ children }) {
  const [scale, setScale] = useState(1);
  useEffect(() => {
    const onResize = () => {
      const s = Math.min(1, (window.innerWidth - 48) / 920);
      setScale(s);
    };
    onResize();
    window.addEventListener("resize", onResize);
    return () => window.removeEventListener("resize", onResize);
  }, []);
  return (
    <div className="stage" style={{ transform: "scale(" + scale + ")" }}>
      {children}
    </div>
  );
}

function App() {
  const [songA, setSongA] = useState(0);
  const [songB, setSongB] = useState(0);

  return (
    <div className="scene">
      <span className="orb orb-a" />
      <span className="orb orb-b" />
      <Stage>
        <div className="heads">
          <div className="t">Netease Desktop Lyrics · Redesign</div>
          <div className="n">876 × 248 pt · 两种方向对比</div>
          <div className="desc">
            同一套交互、同一条时间轴，只换设计语言。<b>鼠标移入浮层</b>唤出控制条；<b>点击波形</b>跳转；右侧三个工具键可点。
          </div>
        </div>

        <div className="frame">
          <div className="frame-label">
            <span className="idx">Ⅰ</span>
            <span className="name">浮光玻璃 · 现代通透</span>
            <span className="note">玻璃层 + 环境晕光 + 暖白主字</span>
          </div>
          <Player variant="a" tracks={TRACKS} songIndex={songA} setSongIndex={setSongA} />
        </div>

        <div className="divider" />

        <div className="frame">
          <div className="frame-label">
            <span className="idx">Ⅱ</span>
            <span className="name">墨与纸 · 东方极简</span>
            <span className="note">宋体大字 + 留白 + 朱砂点睛</span>
          </div>
          <Player variant="b" tracks={TRACKS} songIndex={songB} setSongIndex={setSongB} initialPos={10400} />
        </div>

        <div className="footer-hint">
          演示原型 · 歌词为示意文案，可替换为真实 LRC 时间轴<br />
          <em>点击标题切换歌曲 · 点击波形跳转 · hover 显示控制条</em>
        </div>
      </Stage>
      <div className="toast">提示：把鼠标移到浮层上，控制条会像真机一样浮现</div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
